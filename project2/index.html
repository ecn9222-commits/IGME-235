<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia - Ellie Nagle</title>

        integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous"> -->

        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="css/bootstrap-reboot.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Old Bootstrap Links
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"
        integrity="sha384-W8fXfP3gkOKtndU4JGtKDvXbO53Wy8SZCQHczT5FMiiqmQfUpWbYdTil/SxwZgAN"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.min.js"
        integrity="sha384-skAcpIdS7UcVUC05LJ9Dxay8AXcDYfBJqt1CJ85S/CFujBsIzCIv+l9liuYLaMQ/"
        crossorigin="anonymous"></script> -->
    <script src="js/trivia.js"></script>
</head>

<body>
    <header>
        <h1>Trivia</h1>

        <div id="search_details">
            <select id="category">
                <!-- hardcoded for now -->
                <option value="-1">Choose a Category</option>
                <option value="-1">Any Category</option>
            </select>
            <select id="num_questions">
                <option value="1">1</option>
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="15">15</option>
                <option value="20">20</option>
                <option value="25">25</option>
                <option value="30">30</option>
                <option value="35">35</option>
                <option value="40">40</option>
                <option value="45">45</option>
                <option value="50">50</option>
            </select>
            <button id="generate" type="button">Generate Questions!</button>
        </div>
    </header>

    <main>
        <button id="switchDisplay" type="button">Display All Questions</button>
        <div id="questions">
            <div id="slideshow">
                <div id="carouselPeek" class="carousel carousel-overlay slide" data-bs-ends="stop"
                    style="--bs-carousel-items-peek: 3rem; --bs-carousel-items-gap: 1rem;">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="carousel-overlay-controls">
                            <div>
                                <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselPeek"
                                    data-bs-slide="prev" style="--bs-carousel-control-icon-width: 1rem;">
                                    <span class="carousel-icon-prev" aria-hidden="true"></span>
                                    <span class="visually-hidden">Previous</span>
                                </button>
                                <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselPeek"
                                    data-bs-slide="next" style="--bs-carousel-control-icon-width: 1rem;">
                                    <span class="carousel-icon-next" aria-hidden="true"></span>
                                    <span class="visually-hidden">Next</span>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <div class="q_content d-block w-100 rounded-5">
                                <h3 class="q_num">Question #0</h3>
                                <h2 class="q_question">No Questions Yet!</h2>
                                <p class="q_answer">Select a catergory and generate questions!</p>
                                <button type="button" class="q_reveal">Reveal Answer</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="showAll"></div>
    </main>


    <!-- Old Bootstrap Links
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"
        integrity="sha384-W8fXfP3gkOKtndU4JGtKDvXbO53Wy8SZCQHczT5FMiiqmQfUpWbYdTil/SxwZgAN"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.min.js"
        integrity="sha384-skAcpIdS7UcVUC05LJ9Dxay8AXcDYfBJqt1CJ85S/CFujBsIzCIv+l9liuYLaMQ/"
        crossorigin="anonymous"></script> -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
