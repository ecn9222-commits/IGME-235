<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Web Apps-4-HW</title>
    <style>
        body {
            border: 1px solid gray;
        }
    </style>
</head>

<body>
    <h1>My Favorites</h1>
    <h2>My Favorite Colors</h2>

    <ol id="colorsList">

    </ol>

    <h2>My Favorite Foods</h2>

    <ol id="foodsList">

    </ol>

    <h2>My Favorite Links</h2>

    <ol id="linksList">

    </ol>

    <script>
        "use strict";
        let colors = ["blue", "purple", "green", "yellow", "red"];
        let foods = ["meatloaf", "mac and cheese", "broccoli", "chicken", "noodles"]; // add some foods

        // Optional - can you figure out how to pull both the key AND the value
        // from the `links` object literal?
        let links = {
            "RIT": "http://www.rit.edu",
            "RWAG": "https://www.facebook.com/RWAGclub",
            "New Media Club": "http://newmediaclub.cias.rit.edu"
        }

        // Add colors to list
        let listElement = document.querySelector("ol");
        for (let i = 0; i < colors.length; i++) {
            let listItem = document.createElement("li");
            listItem.innerHTML = colors[i];
            listElement.appendChild(listItem);
        }

        // Add foods to list
        listElement = document.querySelector("ol:nth-of-type(2)");
        for (let foodItem of foods) {
            let listItem = document.createElement("li");
            listItem.innerHTML = foodItem;
            listElement.appendChild(listItem);
        }

        // Add links to list
        listElement = document.getElementById("linksList")
        for (let key in links) {
            let listItem = document.createElement("li");
            listItem.innerHTML = `<a href="${links[key]}">${key}</a>`;
            listElement.appendChild(listItem);
        }

    </script>
</body>

</html>
