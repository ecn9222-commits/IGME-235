<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>DOM-3</title>
    <style>
        body {
            border: 1px solid gray;
        }

        p b {
            transform: rotate(20deg)
        }
    </style>
</head>

<body>
    <h1>My Page</h1>
    <h2>Info</h2>
    <h2>Pictures</h2>
    <h2>More Info</h2>
    <p>Blah <b>Blah</b> Blah</p>
    <p>Blah <b>Blah</b> Blah</p>
    <p id="lastParagraph">Blah <b>Blah</b> Blah</p>
    <footer>Copyright &copy; <b>20XX</b></footer>
    <script>
        "use strict";

        // add your own code here.
        document.querySelector("h1").innerHTML = "My UFO Page";
        document.querySelector("h2").innerHTML = "My UFO Info";
        document.querySelector("h2:nth-of-type(2)").innerHTML = "My UFO Pictures";
        document.querySelector("h2:nth-of-type(3)").innerHTML = "";
        let body = document.querySelector("body");
        body.style.fontFamily = "sans-serif";
        body.style.color = "#bf4b34";
        let firstPara = document.querySelector("p");
        firstPara.innerHTML = "Report your UFO sightings here: <a href='http://www.nuforc.org/'>http://www.nuforc.org/</a>";
        firstPara.style.color = "green";
        firstPara.style.fontWeight = "bold";
        firstPara.style.fontSize = "2em";
        firstPara.style.textTransform = "uppercase";
        firstPara.style.textShadow = "3px 2px #A44";
        document.querySelector("p:nth-of-type(2)").innerHTML = "";
        document.querySelector("p:nth-of-type(3)").innerHTML = "<img src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGOwqvfdHTzgltWAroWwNpzGiAv3Mp0rGbM43G1VtLtA&s=10' alt='UFO'>";
        document.querySelector("footer").innerHTML = "&copy; 2026 Ellie Nagle"

    </script>
</body>

</html>
